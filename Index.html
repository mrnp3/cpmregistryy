<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CPM Registry Players</title>
<style>
body{
background:#000;
color:#fff;
font-family:Arial;
text-align:center;
padding:20px;
}
input,button{
padding:10px;
font-size:18px;
}
img{
max-width:90%;
margin-top:20px;
display:none;
}
</style>
</head>
<body>

<h1>CPM Registry</h1>

<input id="idInput" placeholder="Enter ID">
<button onclick="searchCard()">Search</button>

<br><br>

<img id="cardImage">

<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTEvagVZxVn8RG3ScLOlFfIssHJIe5lWwcKN3fFhT3Q_7T3Dj74Yr7zY27gmfonOsgBc2sr_p9z_2wV/pub?output=csv";

let players = {};

fetch(SHEET_URL)
.then(r => r.text())
.then(csv => {

const rows = csv.trim().split("\n");

for(let i=1;i<rows.length;i++){

const cols = rows[i].split(",");

if(cols.length >= 2){
players[cols[0].trim()] = cols[1].trim();
}

}

});

function searchCard(){

const id = document.getElementById("idInput").value.trim();
const img = document.getElementById("cardImage");

if(players[id]){
img.src = players[id];
img.style.display = "block";
}else{
alert("Player Not Found");
}

}

</script>

</body>
</html>
